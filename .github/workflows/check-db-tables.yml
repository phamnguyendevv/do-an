name: Check DB Tables (one-time, read-only)

on:
  workflow_dispatch:

jobs:
  check:
    name: Check DB Tables on VPS
    runs-on: ubuntu-latest
    environment: cicd
    steps:
      - name: SSH to VPS and list real Postgres tables (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker ps --format '{{.Names}} {{.Status}}'
            set -a
            if [ -f /opt/app/.env.production ]; then . /opt/app/.env.production; fi
            set +a
            echo "=== tables in public schema ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY 1;" || true
            echo "=== migration tables ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE '%migration%' ORDER BY 1;" || true
            echo "=== recorded migrations ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT timestamp, name FROM migrations ORDER BY timestamp;" || true
            echo "=== export_receipts columns ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='export_receipts' ORDER BY ordinal_position;" || true
            echo "=== bookstore_orders columns ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='bookstore_orders' ORDER BY ordinal_position;" || true
            echo "=== foreign key constraints ==="
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -c "SELECT conrelid::regclass::text AS table_name, conname, pg_get_constraintdef(oid) FROM pg_constraint WHERE contype='f' ORDER BY 1, 2;" || true
            echo "=== row counts ==="
            for t in books categories users suppliers bookstore_orders order_histories export_receipts import_receipts payment_transactions stock_movements stock_audits activity_logs promotions customers; do echo "-- $t"; docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM \"$t\";" || echo MISSING_OR_ERROR; done
            echo "=== backend logs tail 30 ==="
            docker logs --tail 30 app-backend 2>&1 || true
