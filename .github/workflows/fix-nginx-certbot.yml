name: Fix Nginx Certbot (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    name: Fix Nginx and Certbot on VPS
    runs-on: ubuntu-latest
    environment: cicd
    steps:
      - name: Checkout code (lay nginx config tu repo)
        uses: actions/checkout@v4

      - name: Copy nginx config len VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "nginx/frontend.conf,nginx/api.conf"
          target: "/opt/app"

      - name: SSH vao VPS va sua nginx/certbot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -x
            mkdir -p /var/www/html /opt/app/nginx
            if [ -f /opt/app/frontend.conf ]; then mkdir -p /opt/app/nginx; mv /opt/app/frontend.conf /opt/app/nginx/frontend.conf; fi
            if [ -f /opt/app/api.conf ]; then mkdir -p /opt/app/nginx; mv /opt/app/api.conf /opt/app/nginx/api.conf; fi
            cp /etc/nginx/sites-available/zymail.site /root/zymail.site.bak 2>/dev/null || true
            cp /etc/nginx/sites-available/api.zymail.site /root/api.zymail.site.bak 2>/dev/null || true
            printf '%s\n' 'server {' '    listen 80;' '    listen [::]:80;' '    server_name zymail.site www.zymail.site;' '    location /.well-known/acme-challenge/ {' '        root /var/www/html;' '    }' '    location / {' '        return 301 https://zymail.site$request_uri;' '    }' '}' > /etc/nginx/sites-available/zymail.site
            ln -sf /etc/nginx/sites-available/zymail.site /etc/nginx/sites-enabled/zymail.site
            nginx -t
            systemctl reload nginx || service nginx reload
            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y certbot python3-certbot-nginx
            fi
            certbot --nginx -d zymail.site -d www.zymail.site -d api.zymail.site --agree-tos --register-unsafely-without-email --redirect -n || certbot --nginx -d zymail.site -d api.zymail.site --agree-tos --register-unsafely-without-email --redirect -n
            ls -l /etc/letsencrypt/live/
            ls -l /etc/letsencrypt/options-ssl-nginx.conf
            cp /opt/app/nginx/frontend.conf /etc/nginx/sites-available/zymail.site
            cp /opt/app/nginx/api.conf /etc/nginx/sites-available/api.zymail.site
            ln -sf /etc/nginx/sites-available/zymail.site /etc/nginx/sites-enabled/zymail.site
            ln -sf /etc/nginx/sites-available/api.zymail.site /etc/nginx/sites-enabled/api.zymail.site
            nginx -t
            systemctl reload nginx || service nginx reload
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx || service nginx reload || true
            echo "===== sites-enabled ====="
            ls -l /etc/nginx/sites-enabled/
            echo "===== docker ps ====="
            docker ps --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "===== curl frontend localhost ====="
            curl -i --max-time 10 http://127.0.0.1:3001/ | head -20 || true
            echo "===== curl backend localhost ====="
            curl -i --max-time 10 http://127.0.0.1:3000/health | head -20 || true
            echo "===== nginx -T server_name ====="
            nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|listen|ssl_certificate' || true
