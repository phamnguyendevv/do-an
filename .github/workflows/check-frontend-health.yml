name: Check Frontend Health (one-time, read-only)

on:
  workflow_dispatch:

jobs:
  check:
    name: Check Frontend Health on VPS
    runs-on: ubuntu-latest
    environment: cicd
    steps:
      - name: SSH to VPS and inspect frontend health (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker ps --format '{{.Names}} {{.Status}}'
            echo "=== frontend container inspect: state and health ==="
            docker inspect app-frontend --format 'Status: {{.State.Status}} Health: {{.State.Health.Status}} StartedAt: {{.State.StartedAt}}' || true
            echo "=== frontend health log ==="
            docker inspect app-frontend --format '{{range .State.Health.Log}}{{.Start}} exit={{.ExitCode}} output={{.Output}}{{println}}{{end}}' || true
            echo "=== frontend logs tail 100 ==="
            docker logs --tail 100 app-frontend 2>&1 || true
            echo "=== wget robots.txt inside frontend container ==="
            docker exec app-frontend wget --no-verbose --tries=1 --spider http://localhost:3000/robots.txt 2>&1 || true
            echo "=== curl robots.txt inside frontend container ==="
            docker exec app-frontend wget -qO- http://localhost:3000/robots.txt 2>&1 | head -20 || true
            echo "=== curl from host to 3001 ==="
            curl -s -i --max-time 10 http://127.0.0.1:3001/robots.txt | head -20 || true
            curl -s -i --max-time 10 http://127.0.0.1:3001/ | head -20 || true
            echo "=== frontend image and compose healthcheck ==="
            docker inspect app-frontend --format 'Image: {{.Config.Image}} Healthcheck: {{.Config.Healthcheck}}' || true
            grep -A 6 'frontend:' /opt/app/docker-compose.prod.yml | head -40 || true
