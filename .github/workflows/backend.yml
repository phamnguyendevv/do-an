name:  Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'be/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/backend.yml'
      - 'scripts/deploy-be.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'be/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/do-an-backend

jobs:
  test:
    name:  Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: be/package-lock.json

      - name:  Install dependencies
        run: npm ci

      - name:  Run ESLint
        run: npm run lint

      - name:  Run Tests
        run: npm test
        env:
          NODE_ENV: test

  build-and-push:
    name:  Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name:  Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name:  Build & Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name:  Deploy to VPS
    runs-on: ubuntu-latest
    environment: cicd
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name:  Checkout code (lấy script deploy)
        uses: actions/checkout@v4

      - name: 📁 Copy deploy script lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "scripts/deploy-be.sh,docker-compose.prod.yml"
          target: "/opt/app"

      - name: 🚀 SSH vào VPS và chạy deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            chmod +x /opt/app/scripts/deploy-be.sh
            GITHUB_ACTOR=${{ github.actor }} bash /opt/app/scripts/deploy-be.sh

      - name:  Deploy Backend hoàn tất
        run: echo "Backend deployed successfully at $(date)"
