name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - 'nginx/frontend.conf'
      - 'docker-compose.prod.yml'
      - '.github/workflows/frontend.yml'
      - 'scripts/deploy-fe.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'fe/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/do-an-frontend

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: cicd
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./fe
          file: ./fe/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_API_PREFIX=/api/v1
            VITE_SEPAY_BANK=${{ secrets.VITE_SEPAY_BANK }}
            VITE_SEPAY_ACCOUNT=${{ secrets.VITE_SEPAY_ACCOUNT }}
            VITE_SEPAY_ACCOUNT_NAME=${{ secrets.VITE_SEPAY_ACCOUNT_NAME }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: cicd
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 📁 Copy config và deploy script lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "nginx/frontend.conf,scripts/deploy-fe.sh,docker-compose.prod.yml"
          target: "/opt/app"

      - name: 🚀 SSH vào VPS và chạy deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            if [ ! -f /opt/app/scripts/deploy-fe.sh ] && [ -f /opt/app/deploy-fe.sh ]; then
              mkdir -p /opt/app/scripts
              mv /opt/app/deploy-fe.sh /opt/app/scripts/deploy-fe.sh
            fi
            if [ ! -f /opt/app/nginx/frontend.conf ] && [ -f /opt/app/frontend.conf ]; then
              mkdir -p /opt/app/nginx
              mv /opt/app/frontend.conf /opt/app/nginx/frontend.conf
            fi
            chmod +x /opt/app/scripts/deploy-fe.sh
            GITHUB_ACTOR=${{ github.actor }} GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} bash /opt/app/scripts/deploy-fe.sh

      - name: Deploy Frontend hoàn tất
        run: echo "Frontend deployed successfully at $(date)"
