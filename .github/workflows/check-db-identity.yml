name: Check DB Identity (one-time, read-only)

on:
  workflow_dispatch:

jobs:
  check:
    name: Check DB Identity on VPS
    runs-on: ubuntu-latest
    environment: cicd
    steps:
      - name: SSH to VPS and identify Postgres databases (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            docker ps --format '{{.Names}} {{.Status}}'
            echo "=== variable names in /opt/app/.env.production (names only, NO values) ==="
            awk -F= '{print NR": "$1}' /opt/app/.env.production || true
            echo "=== DATABASE_NAME from env file (name only) ==="
            grep '^DATABASE_NAME=' /opt/app/.env.production || echo "DATABASE_NAME line not found"
            echo "=== DATABASE_USER from env file (name only) ==="
            grep '^DATABASE_USER=' /opt/app/.env.production || echo "DATABASE_USER line not found"
            echo "=== postgres container POSTGRES_DB (name only) ==="
            docker exec app-postgres sh -c 'echo $POSTGRES_DB' || true
            echo "=== backend container DATABASE_NAME (name only) ==="
            docker exec app-backend sh -c 'echo $DATABASE_NAME' || true
            echo "=== all databases in this Postgres instance ==="
            set -a
            if [ -f /opt/app/.env.production ]; then . /opt/app/.env.production; fi
            set +a
            docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d postgres -Atc "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY 1;" || true
            echo "=== per-database tables and migrations count ==="
            for db in $(docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d postgres -Atc "SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY 1;"); do echo "--- database: $db ---"; docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$db" -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY 1;" || echo "TABLE_LIST_ERROR"; docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$db" -Atc "SELECT count(*) FROM migrations;" || echo "NO_MIGRATIONS_TABLE"; docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$db" -Atc "SELECT count(*) FROM export_receipts;" || echo "NO_EXPORT_RECEIPTS"; docker exec -e PGPASSWORD="$DATABASE_PASSWORD" app-postgres psql -U "$DATABASE_USER" -d "$db" -Atc "SELECT count(*) FROM bookstore_orders;" || echo "NO_BOOKSTORE_ORDERS"; done
            echo "=== backend logs tail 20 ==="
            docker logs --tail 20 app-backend 2>&1 || true
