
server {
    listen 80;
    listen [::]:80;
    server_name zymail.site www.zymail.site;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect tất cả traffic HTTP sang HTTPS
    location / {
        return 301 https://zymail.site$request_uri;
    }
}

# Redirect www → non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zymail.site;

    ssl_certificate /etc/letsencrypt/live/zymail.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zymail.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zymail.site$request_uri;
}

# ============================================================
# HTTPS - Frontend Static Files
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zymail.site;

    # SSL certificates (do certbot quản lý)
    ssl_certificate /etc/letsencrypt/live/zymail.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zymail.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root thư mục chứa file build Vite
    root /opt/app/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1000;

    # --------------------------------------------------------
    # Cache lâu dài cho static assets có hash trong tên file
    # (Vite tự động thêm hash vào file js/css khi build)
    # --------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------
    # SPA fallback - React Router / TanStack Router
    # Mọi route đều trả về index.html để client-side routing hoạt động
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Không cache index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
